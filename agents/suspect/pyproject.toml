# Owned by Person 2 (Agent Engine). Person 1 created this minimal version so that
# `pip install -e agents/suspect` works for mystery_core. Extend it freely; keep the
# mystery_core dependencies below.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suspect-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pymongo>=4.10,<5",
    "pydantic>=2.11",
    "voyageai>=0.3",
    "agent-engine-sdk-langgraph==0.11.11",
    "langgraph>=1.2.11,<2",
    "langchain-openai==1.7.4",
    "python-dotenv>=1.0",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

# Prompt templates are loaded at runtime; without this the deployed agent can't find them.
[tool.setuptools.package-data]
"mystery_core.engine.prompts" = ["*.txt"]
